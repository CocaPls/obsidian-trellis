name: Bug report
description: Report a reproducible Trellis problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use a test vault when possible, and sanitize note names, paths, tags, screenshots, and logs before posting them publicly.
  - type: input
    id: trellis-version
    attributes:
      label: Trellis version
      placeholder: e.g. 0.7.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: 1.13.7
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal, sanitized example of the tags and filenames involved.
      placeholder: |
        1. Create a note named AA01-example.md
        2. Add tags: [trel/AA/01]
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal note content, usernames, home-directory paths, tokens, and other private data before uploading.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this with the latest Trellis release.
          required: true
        - label: I removed private vault content and credentials from this public report.
          required: true
